# gangz1o/clash4docker 本地配置模式公开模板。
# 部署前请替换 URL1-URL4、CHANGE_ME_DASHBOARD_SECRET 和示例媒体域名。
mixed-port: 7892
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
ipv6: true
external-controller: 0.0.0.0:9090
# 替换为强随机密钥，并在 Dashboard 中填写相同的值。
secret: 'CHANGE_ME_DASHBOARD_SECRET'
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter:
    - rule-set:private
    - rule-set:fakeip_filter
    - rule-set:geolocation-cn
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
  default-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
  nameserver:
    - https://cloudflare-dns.com/dns-query#默认代理
    - https://dns.google/dns-query#默认代理
  nameserver-policy:
    rule-set:cn:
      - 223.5.5.5
      - 119.29.29.29
  direct-nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29
hosts:
  cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1
  dns.google:
    - 8.8.8.8
    - 8.8.4.4
  services.googleapis.cn: services.googleapis.com
  +.mcdn.bilivideo.com:
    - 0.0.0.0
  +.mcdn.bilivideo.cn:
    - 0.0.0.0
  +.edge.mountaintoys.cn:
    - 0.0.0.0
  +.h2.smtcdns.net:
    - 0.0.0.0
  dns.msftncsi.com:
    - 131.107.255.255
    - fd3e:4f5a:5b81::1
proxy-providers:
  # provider1-provider4 是公开模板名称；重命名时需同步修改各代理组的 use 列表。
  provider1:
    type: http
    url: 'URL1' # 替换为第 1 个 Mihomo/Clash YAML 订阅地址。
    path: ./providers/provider1.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.apple.com/library/test/success.html
      interval: 600
      timeout: 3000
      lazy: true
    override:
      additional-prefix: '[provider1] '
  provider2:
    type: http
    url: 'URL2' # 替换为第 2 个 Mihomo/Clash YAML 订阅地址。
    path: ./providers/provider2.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.apple.com/library/test/success.html
      interval: 600
      timeout: 3000
      lazy: true
    override:
      additional-prefix: '[provider2] '
  provider3:
    type: http
    url: 'URL3' # 替换为第 3 个 Mihomo/Clash YAML 订阅地址。
    path: ./providers/provider3.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.apple.com/library/test/success.html
      interval: 600
      timeout: 3000
      lazy: true
    override:
      additional-prefix: '[provider3] '
  provider4:
    type: http
    url: 'URL4' # 替换为第 4 个 Mihomo/Clash YAML 订阅地址。
    path: ./providers/provider4.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.apple.com/library/test/success.html
      interval: 600
      timeout: 3000
      lazy: true
    override:
      additional-prefix: '[provider4] '
proxies:
  - name: 🇨🇳 直连 | 双栈
    type: direct
  - name: 🇨🇳 直连 | IPv4优先
    type: direct
    ip-version: ipv4-prefer
  - name: 🇨🇳 直连 | IPv6优先
    type: direct
    ip-version: ipv6-prefer
  - name: 🇨🇳 直连 | 仅IPv4
    type: direct
    ip-version: ipv4
  - name: 🇨🇳 直连 | 仅IPv6
    type: direct
    ip-version: ipv6
